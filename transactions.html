<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>व्यवहार | रोजचा जमा खर्च अहवाल</title>

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="app-header">

    <div class="header-left">

        <button class="icon-btn"
                type="button"
                onclick="goHome()">

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <div>

            <h1>
                व्यवहार
            </h1>

            <p>
                जमा आणि खर्चाची नोंद
            </p>

        </div>

    </div>


    <button class="icon-btn"
            type="button"
            onclick="loadTransactions()"
            title="Refresh">

        <i class="fa-solid fa-rotate"></i>

    </button>

</header>



<!-- =========================================================
     MAIN CONTENT
========================================================= -->

<main class="page-container">


    <!-- =====================================================
         SUMMARY
    ====================================================== -->

    <section class="summary-grid">


        <!-- Total Income -->

        <div class="summary-card income-card">

            <div class="summary-icon">

                <i class="fa-solid fa-arrow-down"></i>

            </div>

            <div>

                <span>
                    एकूण जमा
                </span>

                <strong id="transactionTotalIncome">
                    ₹0.00
                </strong>

            </div>

        </div>



        <!-- Total Expense -->

        <div class="summary-card expense-card">

            <div class="summary-icon">

                <i class="fa-solid fa-arrow-up"></i>

            </div>

            <div>

                <span>
                    एकूण खर्च
                </span>

                <strong id="transactionTotalExpense">
                    ₹0.00
                </strong>

            </div>

        </div>



        <!-- Net Balance -->

        <div class="summary-card balance-card">

            <div class="summary-icon">

                <i class="fa-solid fa-wallet"></i>

            </div>

            <div>

                <span>
                    शिल्लक
                </span>

                <strong id="transactionNetBalance">
                    ₹0.00
                </strong>

            </div>

        </div>


    </section>



    <!-- =====================================================
         FILTER SECTION
    ====================================================== -->

    <section class="content-card">


        <div class="section-title">

            <div>

                <h2>
                    व्यवहार शोधा
                </h2>

                <p>
                    तारीख, प्रकार किंवा खात्यानुसार व्यवहार पाहा
                </p>

            </div>

        </div>



        <!-- Search -->

        <div class="form-group">

            <label for="transactionSearch">

                <i class="fa-solid fa-magnifying-glass"></i>

                Search

            </label>


            <input
                type="search"
                id="transactionSearch"
                placeholder="Category, Note किंवा Account शोधा..."
                autocomplete="off"
            >

        </div>



        <!-- Filters -->

        <div class="form-grid">


            <!-- Type -->

            <div class="form-group">

                <label for="transactionType">

                    व्यवहार प्रकार

                </label>


                <select id="transactionType">

                    <option value="all">
                        सर्व व्यवहार
                    </option>

                    <option value="income">
                        जमा
                    </option>

                    <option value="expense">
                        खर्च
                    </option>

                </select>

            </div>



            <!-- Account -->

            <div class="form-group">

                <label for="transactionAccount">

                    खाते

                </label>


                <select id="transactionAccount">

                    <option value="all">
                        सर्व खाती
                    </option>

                </select>

            </div>



            <!-- Month -->

            <div class="form-group">

                <label for="transactionMonth">

                    महिना

                </label>


                <input
                    type="month"
                    id="transactionMonth"
                >

            </div>



            <!-- Date -->

            <div class="form-group">

                <label for="transactionDate">

                    तारीख

                </label>


                <input
                    type="date"
                    id="transactionDate"
                >

            </div>


        </div>



        <!-- Filter Buttons -->

        <div class="filter-actions">

            <button
                type="button"
                class="btn btn-primary"
                onclick="applyTransactionFilters()">

                <i class="fa-solid fa-filter"></i>

                Filter

            </button>


            <button
                type="button"
                class="btn btn-secondary"
                onclick="clearTransactionFilters()">

                <i class="fa-solid fa-xmark"></i>

                Clear

            </button>

        </div>

    </section>



    <!-- =====================================================
         TRANSACTION COUNT
    ====================================================== -->

    <div class="transaction-list-header">

        <div>

            <h2>
                व्यवहार यादी
            </h2>

            <span id="transactionCount">
                0 व्यवहार
            </span>

        </div>


        <button
            type="button"
            class="btn btn-primary"
            onclick="goToIncome()">

            <i class="fa-solid fa-plus"></i>

            जमा नोंदवा

        </button>


        <button
            type="button"
            class="btn btn-danger"
            onclick="goToExpense()">

            <i class="fa-solid fa-minus"></i>

            खर्च नोंदवा

        </button>

    </div>



    <!-- =====================================================
         TRANSACTION LIST
    ====================================================== -->

    <section class="transaction-list"
             id="transactionsList">


        <!-- Empty State -->

        <div class="empty-state"
             id="emptyTransactionState">

            <div class="empty-icon">

                <i class="fa-solid fa-receipt"></i>

            </div>


            <h3>
                अजून कोणताही व्यवहार नाही
            </h3>


            <p>
                जमा किंवा खर्चाची पहिली नोंद करा.
            </p>


            <div class="empty-actions">

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="goToIncome()">

                    <i class="fa-solid fa-arrow-down"></i>

                    जमा नोंदवा

                </button>


                <button
                    type="button"
                    class="btn btn-danger"
                    onclick="goToExpense()">

                    <i class="fa-solid fa-arrow-up"></i>

                    खर्च नोंदवा

                </button>

            </div>

        </div>


    </section>


</main>



<!-- =========================================================
     DELETE CONFIRMATION MODAL
========================================================= -->

<div class="modal-overlay"
     id="deleteTransactionModal"
     style="display:none;">


    <div class="modal-card">


        <div class="modal-icon">

            <i class="fa-solid fa-trash"></i>

        </div>


        <h3>
            व्यवहार Delete करायचा?
        </h3>


        <p id="deleteTransactionMessage">

            हा व्यवहार कायमचा delete होईल.

        </p>


        <div class="modal-actions">


            <button
                type="button"
                class="btn btn-secondary"
                onclick="closeDeleteModal()">

                Cancel

            </button>


            <button
                type="button"
                class="btn btn-danger"
                onclick="confirmDeleteTransaction()">

                <i class="fa-solid fa-trash"></i>

                Delete

            </button>


        </div>


    </div>

</div>



<!-- =========================================================
     BOTTOM NAVIGATION
========================================================= -->

<nav class="bottom-nav">


    <!-- Home -->

    <button class="nav-item"
            type="button"
            onclick="goHome()">

        <i class="fa-solid fa-house"></i>

        <span>
            होम
        </span>

    </button>



    <!-- Income -->

    <button class="nav-item"
            type="button"
            onclick="goToIncome()">

        <i class="fa-solid fa-arrow-down"></i>

        <span>
            जमा
        </span>

    </button>



    <!-- Expense -->

    <button class="nav-item"
            type="button"
            onclick="goToExpense()">

        <i class="fa-solid fa-arrow-up"></i>

        <span>
            खर्च
        </span>

    </button>



    <!-- Transactions -->

    <button class="nav-item active"
            type="button"
            onclick="goToTransactions()">

        <i class="fa-solid fa-list"></i>

        <span>
            व्यवहार
        </span>

    </button>



    <!-- Budget -->

    <button class="nav-item"
            type="button"
            onclick="goToBudget()">

        <i class="fa-solid fa-chart-pie"></i>

        <span>
            Budget
        </span>

    </button>


</nav>



<!-- =========================================================
     APP JS
========================================================= -->

<script src="app.js"></script>


<!-- =========================================================
     TRANSACTIONS JS
========================================================= -->

<script src="transactions.js"></script>


</body>

</html>
