<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#5b0b18">

    <title>जमा नोंदवा | रोजचा जमा खर्च अहवाल</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="style.css">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#5b0b18">

<meta name="mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<link rel="apple-touch-icon"
      href="icons/icon-192.png">
</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="app-header">

    <div class="header-brand">

        <div class="app-logo">

            <i class="fa-solid fa-arrow-down"></i>

        </div>

        <div>

            <h1>जमा नोंदवा</h1>

            <p>रोजचा जमा खर्च अहवाल</p>

        </div>

    </div>


    <button class="notification-btn"
            onclick="goHome()">

        <i class="fa-solid fa-house"></i>

    </button>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="form-container">


    <!-- =================================================
         PAGE TITLE
    ================================================== -->

    <section class="page-intro">

        <div class="page-intro-icon income-intro">

            <i class="fa-solid fa-money-bill-transfer"></i>

        </div>

        <div>

            <h2>नवीन जमा नोंद</h2>

            <p>
                मिळालेली रक्कम येथे नोंदवा.
            </p>

        </div>

    </section>



    <!-- =================================================
         TODAY SUMMARY
    ================================================== -->

    <section class="income-summary">

        <div>

            <span>
                आजची जमा
            </span>

            <strong id="todayIncome">
                ₹0.00
            </strong>

        </div>


        <div>

            <span>
                या महिन्याची जमा
            </span>

            <strong id="monthIncome">
                ₹0.00
            </strong>

        </div>


        <div>

            <span>
                एकूण जमा
            </span>

            <strong id="totalIncome">
                ₹0.00
            </strong>

        </div>

    </section>



    <!-- =================================================
         INCOME FORM
    ================================================== -->

    <section class="form-card">


        <form id="incomeForm">


            <!-- DATE -->

            <div class="form-group">

                <label for="incomeDate">

                    <i class="fa-solid fa-calendar"></i>

                    तारीख

                    <span>*</span>

                </label>


                <input
                    type="date"
                    id="incomeDate"
                    required
                >

            </div>



            <!-- AMOUNT -->

            <div class="form-group">

                <label for="incomeAmount">

                    <i class="fa-solid fa-indian-rupee-sign"></i>

                    जमा रक्कम

                    <span>*</span>

                </label>


                <div class="amount-input">

                    <span>₹</span>

                    <input
                        type="number"
                        id="incomeAmount"
                        min="0.01"
                        step="0.01"
                        placeholder="उदा. 5000"
                        required
                    >

                </div>

            </div>



            <!-- CATEGORY -->

            <div class="form-group">

                <label for="incomeCategory">

                    <i class="fa-solid fa-layer-group"></i>

                    जमा प्रकार

                    <span>*</span>

                </label>


                <select
                    id="incomeCategory"
                    required
                >

                    <option value="">
                        जमा प्रकार निवडा
                    </option>

                    <option value="Salary">
                        पगार
                    </option>

                    <option value="Business">
                        व्यवसाय
                    </option>

                    <option value="Freelance">
                        Freelance
                    </option>

                    <option value="Interest">
                        व्याज
                    </option>

                    <option value="Gift">
                        भेट / मिळालेली रक्कम
                    </option>

                    <option value="Refund">
                        Refund
                    </option>

                    <option value="Other">
                        इतर
                    </option>

                </select>

            </div>



            <!-- ACCOUNT -->

            <div class="form-group">

                <label for="incomeAccount">

                    <i class="fa-solid fa-building-columns"></i>

                    कोणत्या खात्यात जमा?

                    <span>*</span>

                </label>


                <select
                    id="incomeAccount"
                    required
                >

                    <option value="">
                        खाते निवडा
                    </option>

                </select>


                <small>
                    Cash / Bank / UPI यापैकी खाते निवडा.
                </small>

            </div>



            <!-- PAYMENT MODE -->

            <div class="form-group">

                <label for="incomePaymentMode">

                    <i class="fa-solid fa-credit-card"></i>

                    Payment Mode

                </label>


                <select
                    id="incomePaymentMode"
                >

                    <option value="Cash">
                        Cash
                    </option>

                    <option value="UPI">
                        UPI
                    </option>

                    <option value="Bank Transfer">
                        Bank Transfer
                    </option>

                    <option value="Cheque">
                        Cheque
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>



            <!-- NOTE -->

            <div class="form-group">

                <label for="incomeNote">

                    <i class="fa-solid fa-note-sticky"></i>

                    Note / माहिती

                </label>


                <textarea
                    id="incomeNote"
                    rows="3"
                    maxlength="300"
                    placeholder="उदा. August salary..."
                ></textarea>


                <small id="noteCounter">
                    0 / 300
                </small>

            </div>



            <!-- SAVE -->

            <button
                type="submit"
                class="save-income-btn"
            >

                <i class="fa-solid fa-check"></i>

                जमा नोंदवा

            </button>


            <!-- RESET -->

            <button
                type="button"
                class="reset-btn"
                onclick="resetIncomeForm()"
            >

                <i class="fa-solid fa-rotate-left"></i>

                Reset

            </button>


        </form>

    </section>



    <!-- =================================================
         LAST SAVED
    ================================================== -->

    <section
        id="lastSaved"
        class="last-saved"
        style="display:none;"
    >

        <i class="fa-solid fa-circle-check"></i>

        <div>

            <strong>
                जमा नोंदवली आहे
            </strong>

            <p id="lastSavedText">
                --
            </p>

        </div>

    </section>


</main>



<!-- =====================================================
     BOTTOM NAV
===================================================== -->

<nav class="bottom-nav">


    <button class="nav-item"
            onclick="goHome()">

        <i class="fa-solid fa-house"></i>

        <span>
            मुख्यपृष्ठ
        </span>

    </button>


    <button class="nav-item"
            onclick="goToTransactions()">

        <i class="fa-solid fa-list"></i>

        <span>
            व्यवहार
        </span>

    </button>


    <button class="nav-add income-add"
            onclick="goToExpense()">

        <i class="fa-solid fa-minus"></i>

    </button>


    <button class="nav-item"
            onclick="goToReports()">

        <i class="fa-solid fa-chart-pie"></i>

        <span>
            अहवाल
        </span>

    </button>


    <button class="nav-item"
            onclick="goToSettings()">

        <i class="fa-solid fa-gear"></i>

        <span>
            सेटिंग
        </span>

    </button>


</nav>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="app.js"></script>

<script src="income.js"></script>


</body>

</html>
