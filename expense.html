<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#5b0b18">

    <title>खर्च नोंदवा | रोजचा जमा खर्च अहवाल</title>


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         MAIN CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#5b0b18">

<meta name="mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<link rel="apple-touch-icon"
      href="icons/icon-192.png">
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="app-header">

    <div class="header-brand">

        <div class="app-logo">

            <i class="fa-solid fa-arrow-up"></i>

        </div>


        <div>

            <h1>खर्च नोंदवा</h1>

            <p>रोजचा जमा खर्च अहवाल</p>

        </div>

    </div>


    <button
        class="notification-btn"
        type="button"
        onclick="goHome()"
        title="मुख्यपृष्ठ"
    >

        <i class="fa-solid fa-house"></i>

    </button>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="form-container">


    <!-- =================================================
         PAGE INTRO
    ================================================== -->

    <section class="page-intro">

        <div class="page-intro-icon expense-intro">

            <i class="fa-solid fa-money-bill-transfer"></i>

        </div>


        <div>

            <h2>नवीन खर्च नोंद</h2>

            <p>
                केलेला खर्च येथे नोंदवा.
            </p>

        </div>

    </section>



    <!-- =================================================
         EXPENSE SUMMARY
    ================================================== -->

    <section class="expense-summary">


        <!-- TODAY -->

        <div>

            <span>
                आजचा खर्च
            </span>

            <strong id="todayExpense">
                ₹0.00
            </strong>

        </div>



        <!-- MONTH -->

        <div>

            <span>
                या महिन्याचा खर्च
            </span>

            <strong id="monthExpense">
                ₹0.00
            </strong>

        </div>



        <!-- TOTAL -->

        <div>

            <span>
                एकूण खर्च
            </span>

            <strong id="totalExpense">
                ₹0.00
            </strong>

        </div>


    </section>



    <!-- =================================================
         EXPENSE FORM
    ================================================== -->

    <section class="form-card">


        <form id="expenseForm">


            <!-- =================================================
                 DATE
            ================================================= -->

            <div class="form-group">

                <label for="expenseDate">

                    <i class="fa-solid fa-calendar"></i>

                    तारीख

                    <span>*</span>

                </label>


                <input
                    type="date"
                    id="expenseDate"
                    required
                >

            </div>



            <!-- =================================================
                 AMOUNT
            ================================================= -->

            <div class="form-group">

                <label for="expenseAmount">

                    <i class="fa-solid fa-indian-rupee-sign"></i>

                    खर्चाची रक्कम

                    <span>*</span>

                </label>


                <div class="amount-input">

                    <span class="expense-rupee">
                        ₹
                    </span>


                    <input
                        type="number"
                        id="expenseAmount"
                        min="0.01"
                        step="0.01"
                        inputmode="decimal"
                        placeholder="उदा. 250"
                        required
                    >

                </div>

            </div>



            <!-- =================================================
                 EXPENSE CATEGORY
            ================================================== -->

            <div class="form-group">

                <label for="expenseCategory">

                    <i class="fa-solid fa-layer-group"></i>

                    खर्चाचा प्रकार

                    <span>*</span>

                </label>


                <select
                    id="expenseCategory"
                    required
                >

                    <option value="">
                        खर्चाचा प्रकार निवडा
                    </option>


                    <!-- DAILY GROCERY -->

                    <option value="daily-grocery">
                        🛍️ दररोजचा किराणा खर्च
                    </option>


                    <!-- MONTHLY GROCERY -->

                    <option value="monthly-grocery">
                        🛒 महिन्याचा किराणा खर्च
                    </option>


                    <!-- TRAVEL -->

                    <option value="travel">
                        🚗 प्रवास
                    </option>


                    <!-- SHOPPING -->

                    <option value="shopping">
                        🛍️ खरेदी
                    </option>


                    <!-- LIGHT BILL -->

                    <option value="light-bill">
                        💡 लाईट बिल
                    </option>


                    <!-- MEDICINE -->

                    <option value="medicine">
                        💊 औषधे
                    </option>


                    <!-- MOBILE -->

                    <option value="mobile">
                        📱 मोबाईल
                    </option>


                    <!-- HOME EMI -->

                    <option value="home-emi">
                        🏠 घरचा EMI
                    </option>


                    <!-- HOME MAINTENANCE -->

                    <option value="home-maintenance">
                        🔧 घरचा मेंटेनन्स
                    </option>


                    <!-- OTHER LOAN -->

                    <option value="other-loan">
                        💰 इतर लोन
                    </option>


                    <!-- OTHER -->

                    <option value="other">
                        📦 Other / इतर
                    </option>

                </select>


                <small>
                    Monthly Budget मध्ये ज्या Category साठी Budget ठेवले आहे तीच Category निवडा.
                </small>

            </div>



            <!-- =================================================
                 ACCOUNT
            ================================================== -->

            <div class="form-group">

                <label for="expenseAccount">

                    <i class="fa-solid fa-building-columns"></i>

                    कोणत्या खात्यातून खर्च?

                    <span>*</span>

                </label>


                <select
                    id="expenseAccount"
                    required
                >

                    <option value="">
                        खाते निवडा
                    </option>

                </select>


                <small>
                    ज्या Cash / Bank / UPI खात्यातून पैसे गेले ते निवडा.
                </small>

            </div>



            <!-- =================================================
                 PAYMENT MODE
            ================================================== -->

            <div class="form-group">

                <label for="expensePaymentMode">

                    <i class="fa-solid fa-credit-card"></i>

                    Payment Mode

                </label>


                <select
                    id="expensePaymentMode"
                >

                    <option value="Cash">
                        💵 Cash
                    </option>


                    <option value="UPI">
                        📱 UPI
                    </option>


                    <option value="Bank Transfer">
                        🏦 Bank Transfer
                    </option>


                    <option value="Debit Card">
                        💳 Debit Card
                    </option>


                    <option value="Credit Card">
                        💳 Credit Card
                    </option>


                    <option value="Cheque">
                        🧾 Cheque
                    </option>


                    <option value="Other">
                        📌 Other
                    </option>

                </select>

            </div>



            <!-- =================================================
                 NOTE
            ================================================== -->

            <div class="form-group">

                <label for="expenseNote">

                    <i class="fa-solid fa-note-sticky"></i>

                    Note / माहिती

                </label>


                <textarea
                    id="expenseNote"
                    rows="3"
                    maxlength="300"
                    placeholder="उदा. आजचे lunch, petrol, घरासाठी सामान..."
                ></textarea>


                <small id="expenseNoteCounter">
                    0 / 300
                </small>

            </div>



            <!-- =================================================
                 SAVE BUTTON
            ================================================== -->

            <button
                type="submit"
                class="save-expense-btn"
            >

                <i class="fa-solid fa-check"></i>

                खर्च नोंदवा

            </button>



            <!-- =================================================
                 RESET BUTTON
            ================================================== -->

            <button
                type="button"
                class="reset-btn"
                onclick="resetExpenseForm()"
            >

                <i class="fa-solid fa-rotate-left"></i>

                Reset

            </button>


        </form>

    </section>



    <!-- =================================================
         LAST SAVED
    ================================================== -->

    <section
        id="lastExpenseSaved"
        class="last-saved expense-last-saved"
        style="display:none;"
    >

        <i class="fa-solid fa-circle-check"></i>


        <div>

            <strong>
                खर्च नोंदवला आहे
            </strong>


            <p id="lastExpenseSavedText">
                --
            </p>

        </div>

    </section>


</main>



<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav class="bottom-nav">


    <!-- HOME -->

    <button
        class="nav-item"
        type="button"
        onclick="goHome()"
    >

        <i class="fa-solid fa-house"></i>

        <span>
            मुख्यपृष्ठ
        </span>

    </button>



    <!-- TRANSACTIONS -->

    <button
        class="nav-item"
        type="button"
        onclick="goToTransactions()"
    >

        <i class="fa-solid fa-list"></i>

        <span>
            व्यवहार
        </span>

    </button>



    <!-- QUICK ADD -->

    <button
        class="nav-add expense-add"
        type="button"
        onclick="goToIncome()"
        title="जमा नोंदवा"
    >

        <i class="fa-solid fa-plus"></i>

    </button>



    <!-- REPORTS -->

    <button
        class="nav-item"
        type="button"
        onclick="goToReports()"
    >

        <i class="fa-solid fa-chart-pie"></i>

        <span>
            अहवाल
        </span>

    </button>



    <!-- SETTINGS -->

    <button
        class="nav-item"
        type="button"
        onclick="goToSettings()"
    >

        <i class="fa-solid fa-gear"></i>

        <span>
            सेटिंग
        </span>

    </button>


</nav>



<!-- =====================================================
     QUICK ADD MENU
===================================================== -->

<div
    id="quickAddMenu"
    class="quick-add-menu"
    style="display:none;"
>


    <button
        type="button"
        onclick="goToIncome()"
    >

        <i class="fa-solid fa-arrow-down"></i>

        जमा नोंदवा

    </button>


    <button
        type="button"
        onclick="goToExpense()"
    >

        <i class="fa-solid fa-arrow-up"></i>

        खर्च नोंदवा

    </button>


</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="app.js"></script>

<script src="expense.js"></script>


</body>

</html>
