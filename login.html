<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color"
          content="#5b0b18">

    <meta name="description"
          content="रोजचा जमा खर्च अहवाल - Personal Finance Tracker">

    <meta name="mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <title>Login | रोजचा जमा खर्च अहवाल</title>


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- =====================================================
         LOGIN CSS
    ====================================================== -->

    <link rel="stylesheet"
          href="login.css">

</head>


<body>


<!-- =========================================================
     LOGIN PAGE
========================================================= -->

<div class="login-page">


    <!-- =====================================================
         BACKGROUND DECORATION
    ====================================================== -->

    <div class="background-circle circle-one"></div>

    <div class="background-circle circle-two"></div>

    <div class="background-circle circle-three"></div>



    <!-- =====================================================
         MAIN LOGIN CONTAINER
    ====================================================== -->

    <main class="login-container">


        <!-- =================================================
             APP BRAND
        ================================================== -->

        <section class="brand-section">


            <div class="app-logo">

                <i class="fa-solid fa-wallet"></i>

            </div>


            <h1>
                रोजचा जमा खर्च अहवाल
            </h1>


            <p>
                Personal Finance Tracker
            </p>


        </section>



        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <section class="login-card">


            <!-- LOGIN TITLE -->

            <div class="login-title">

                <div class="login-title-icon">

                    <i class="fa-solid fa-right-to-bracket"></i>

                </div>

                <h2>
                    Login
                </h2>

            </div>



            <!-- =================================================
                 ERROR MESSAGE
            ================================================== -->

            <div id="loginError"
                 class="login-error"
                 role="alert"
                 aria-live="polite">

                <i class="fa-solid fa-circle-exclamation"></i>

                <span id="loginErrorText"></span>

            </div>



            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form id="loginForm"
                  autocomplete="on"
                  novalidate>



                <!-- =================================================
                     USER ID
                ================================================== -->

                <div class="form-group">


                    <label for="userId">

                        User ID

                    </label>


                    <div class="input-wrapper">


                        <i class="fa-solid fa-user input-icon"></i>


                        <input type="text"
                               id="userId"
                               name="username"
                               placeholder="User ID"
                               autocomplete="username"
                               autocapitalize="none"
                               spellcheck="false"
                               maxlength="50">


                    </div>


                    <small id="userIdError"
                           class="field-error">
                    </small>


                </div>



                <!-- =================================================
                     PASSWORD
                ================================================== -->

                <div class="form-group">


                    <label for="password">

                        Password

                    </label>


                    <div class="input-wrapper">


                        <i class="fa-solid fa-lock input-icon"></i>


                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Password"
                               autocomplete="current-password"
                               maxlength="100">


                        <button type="button"
                                id="passwordToggle"
                                class="password-toggle"
                                aria-label="Show Password"
                                tabindex="0">

                            <i class="fa-solid fa-eye"></i>

                        </button>


                    </div>


                    <small id="passwordError"
                           class="field-error">
                    </small>


                </div>



                <!-- =================================================
                     REMEMBER ME
                ================================================== -->

                <div class="remember-row">


                    <label class="remember-label">


                        <input type="checkbox"
                               id="rememberMe">


                        <span class="custom-checkbox">

                            <i class="fa-solid fa-check"></i>

                        </span>


                        <span>
                            मला Login ठेवावे
                        </span>


                    </label>


                </div>



                <!-- =================================================
                     LOGIN BUTTON
                ================================================== -->

                <button type="submit"
                        id="loginButton"
                        class="login-button">


                    <span id="loginButtonContent">

                        <i class="fa-solid fa-right-to-bracket"></i>

                        Login

                    </span>


                </button>



            </form>


        </section>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer class="login-footer">

            <i class="fa-solid fa-shield-halved"></i>

            सुरक्षित Personal Finance Tracker

        </footer>


    </main>

</div>



<!-- =========================================================
     LOGIN JS
========================================================= -->

<script src="login.js"></script>


</body>

</html>
